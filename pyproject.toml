[project]
name = "relann"
version = "0.1.0"
description = "RelANN — Deep Neural Networks as Simply as Database Queries (declarative framework for neural networks over relational data)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Yuval Lubarsky", email = "lubarsky@campus.technion.ac.il"},
]
keywords = ["relational", "neural-networks", "datalog", "pytorch", "graph-neural-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "juplit>=0.0.7",
    "lark>=1.3",
    "pydantic>=2.0",
    "networkx>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    # Torch is pinned to <2.7 because PyG sparse extensions (torch-scatter, etc.)
    # only have prebuilt wheels for that range. Override on a CUDA host as needed.
    "torch>=2.0,<2.7",
    "fastcore>=1.5,<1.13", # `@patch` decorator used throughout the codebase; pinned <1.13 due to a regression in how `_VArgsWrapper` (used by Lark's `@v_args`) interacts with the new co_qualname rewrite
    "scipy>=1.10",                  # used by some DHN homomorphism utilities
]

# NOTE: `torch-scatter`, `torch-geometric`, `torch-sparse`, `torch-cluster` are
# intentionally NOT declared here, and CANNOT be put in an extra either. They are
# compiled C++/CUDA extensions that must match your exact torch + CUDA build, so
# pip can't resolve the right wheel from PyPI — they ship as prebuilt wheels on
# the PyG index and are installed out-of-band:
#
#   pip install --no-build-isolation torch-scatter torch-sparse torch-cluster torch-geometric \
#       -f https://data.pyg.org/whl/torch-2.6.0+cu124.html   # swap cu124 for your tag, or +cpu
#
# `import relann` works without them; only the scatter aggregation ops need them
# (they raise a clear install hint if missing). See docs/install-gpu.md.

[project.urls]
Homepage = "https://github.com/yuvallu/relann"
Repository = "https://github.com/yuvallu/relann"
Paper = "https://arxiv.org/abs/2605.24207"

[project.optional-dependencies]
# Heavier deps only needed by the bundled examples / benchmarks / viz helpers,
# kept out of the core install. e.g. `pip install "relann[examples,viz]"`.
examples = [
    "relbench>=2.0",      # examples/005, examples/006
    "scikit-learn>=1.3",  # examples/004 + HyGNN benchmarks
    "matplotlib>=3.5",    # example plots + scaffold tests
]
viz = [
    "stringdale>=0.5",    # term-graph visualization helper for some demos/tests
    "nbdev>=2.4",         # stringdale imports nbdev at load but doesn't declare it
]
benchmarks = [
    "ogb>=1.3",
]
sql = [
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.16",
]

[dependency-groups]
dev = [
    "poethepoet>=0.25.0",
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
    "pre-commit>=3.0.0",
    "jupytext>=1.16.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.build-backend.wheel]
include = ["relann/relann_grammar.lark"]

[tool.juplit]
notebook_src_dirs = ["relann", "examples"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.poe.tasks]
# Force Python UTF-8 mode for every task: juplit's read_text() defaults to the
# platform encoding (cp1252 on Windows), which fails on any source file that
# contains non-ASCII bytes (we have several).
[tool.poe.env]
PYTHONUTF8 = "1"

[tool.poe.tasks.init]
cmd  = "pre-commit install"
help = "Install git hooks"

# One-command setup AFTER `uv sync`. Installs the PyG sparse stack with
# `--no-build-isolation` from the PyG wheel index. The default URL targets
# CPU on Linux/macOS; for a CUDA host, override TORCH_PYG_URL before running:
#   $env:TORCH_PYG_URL="https://data.pyg.org/whl/torch-2.6.0+cu124.html"
#   uv run poe pyg-install
[tool.poe.tasks.pyg-install]
help  = "Install PyG sparse stack (torch-scatter, torch-sparse, torch-cluster, torch-geometric)."
shell = "uv pip install --no-build-isolation torch-scatter torch-sparse torch-cluster torch-geometric -f ${TORCH_PYG_URL:-https://data.pyg.org/whl/torch-2.6.0+cpu.html}"

[tool.poe.tasks.full-setup]
help     = "First-time setup: uv sync + PyG sparse stack + nb. Run this once after cloning."
sequence = [{cmd = "uv sync"}, {ref = "pyg-install"}, {ref = "nb"}]

[tool.poe.tasks.sync]
cmd  = "juplit sync"
help = "Sync .py <-> .ipynb for paired notebooks"

[tool.poe.tasks.nb]
cmd  = "juplit nb"
help = "Generate .ipynb from .py (run after cloning)"

[tool.poe.tasks.clean]
cmd  = "juplit clean"
help = "Sync then delete all .ipynb files"

[tool.poe.tasks.test]
cmd  = "pytest"
help = "Run pytest across tests/"

[tool.poe.tasks.smoke]
cmd  = "pytest tests/smoke -v"
help = "Fast sanity check (~5s)"

[tool.poe.tasks.quick]
cmd  = "pytest tests/smoke tests/feature -v"
help = "Quick test profile (~15s)"

[tool.poe.tasks.slow-hgt]
shell = """
for f in tests/slow/run_*hgt*.py; do
  echo "=== $f ==="
  python $f 2>&1 | tail -3 || true
done
"""
help = "Manual HGT slow-script sweep (NOT in pytest; needs _external/pyHGT for some). ~10-15 min."

[tool.poe.tasks.sources]
shell = """
fail=0
for f in relann/*.py; do
  [ "$(basename $f)" = "__init__.py" ] && continue
  printf "=== %-40s " "$f"
  if python "$f" > /tmp/_relann_src_log 2>&1; then
    echo "PASS"
  else
    echo "FAIL"
    tail -5 /tmp/_relann_src_log | sed 's/^/    /'
    fail=$((fail + 1))
  fi
done
echo
echo "=== sources: $fail failures ==="
[ $fail -eq 0 ]
"""
help = "Canary: run each `python relann/*.py` standalone, catch crashes in `__main__` demo blocks (~2-3 min)."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Notes on collection scope:
# - relann/*.py is NOT a test path: those files use `if __name__ == "__main__":`
#   for inline demos (not juplit's `if test():`), so there's nothing to collect.
# - Within tests/, only files matching test_*.py are collected. Utility / runner
#   scripts that don't match (e.g. tests/dhn/dhn_external.py, tests/slow/run_*.py,
#   tests/repro/repro_*.py) are not imported at collection time.
# - Test modules that use juplit's `if test():` (test_902, test_912, test_903,
#   test_904, test_hygnn_relnn_high_order) all start with `test_`, so they keep
#   working under this pattern.
norecursedirs = ["nbs", "_external", "_proc", "_docs", "_worktrees", ".probe_results", "research", "examples"]
markers = [
    "smoke: fast critical-path validation",
    "feature: targeted subsystem behavior checks",
    "integration: multi-component workflow checks",
    "slow: expensive and dataset-heavy tests",
    "download: may require cached downloads (e.g. Planetoid)",
    "repro: issue reproduction and historical regressions",
]
